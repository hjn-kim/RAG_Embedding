# ─────────────────────────────────────────────────────────────
# 임베딩 모델 비교 벤치마크 설정
# ─────────────────────────────────────────────────────────────

paths:
  data_dir: data                       # 여기에 .docx 1개, .pdf 1개를 넣습니다
  questions_file: questions/questions.json
  results_dir: results

chunking:
  chunk_size: 500                      # 청크 최대 길이(문자 수)
  chunk_overlap: 100                   # 청크 간 겹침(문자 수)
  min_chunk_chars: 30                  # 이보다 짧은 청크는 버림

retrieval:
  top_k: 10                            # 랭킹 상위 몇 개까지 볼지
  ks: [1, 3]                           # Hit@k 를 계산할 k 목록. MRR·nDCG 는 최대값 기준
                                       # 코퍼스가 작으면 k 를 키워도 전부 1.0 이라 변별력이 없다
  scope: all                           # all      = 두 문서 청크를 모두 후보로 (권장, 더 어려움)
                                       # own_doc  = 질문이 속한 문서 안에서만 검색

runtime:
  device: auto                         # auto | cuda | cpu
  fp16: true                           # GPU에서 half precision 사용
  batch_size: 16                       # OOM 나면 8 또는 4로 낮추세요
  max_seq_length: 1024                 # 모델 입력 토큰 상한 (BGE-M3는 8192까지 가능)
  hf_token: null                       # gated 모델이 있으면 토큰 입력 (보통 null로 충분)

  # ── 속도 측정 ────────────────────────────────────────────────
  # 청크가 몇십 개뿐이면 CUDA 초기화 같은 고정 비용이 연산 시간을 압도해서
  # 먼저 실행된 모델만 손해를 본다. 아래 설정으로 그 왜곡을 제거한다.
  speed_min_texts: 512                 # 이 개수가 될 때까지 텍스트를 복제해 측정 (작업량 확보)
  speed_warmup: 1                      # 측정 전 버리는 실행 횟수 (초기화 비용 제외)
  speed_repeat: 3                      # 측정 횟수 — 최소 시간을 채택. 0 이면 속도 측정 생략

# ─────────────────────────────────────────────────────────────
# 비교할 모델들
#   prefix_style:
#     none          : 프리픽스 없음                      (KURE-v1, BGE-M3, gte)
#     e5            : "query: " / "passage: "            (multilingual-e5-small-ko)
#     e5_inst       : "Instruct: {task}\nQuery: {q}"     (multilingual-e5-large-instruct)
#     instruct_gemma: "<instruct>{task}\n<query>{q}"     (bge-multilingual-gemma2)
#   backend:
#     sentence-transformers : 일반 dense 검색
#     bge-m3                : dense + sparse 하이브리드까지 평가
#
# 무거운 모델은 아래 주석의 VRAM 을 보고 GPU 를 고르세요. 안 쓸 모델은 주석 처리하거나
# `python -m src.run_benchmark --models kure-v1 gte-multilingual-base` 로 골라 돌리면 됩니다.
# ─────────────────────────────────────────────────────────────
models:
  - key: kure-v1
    hf_id: nlpai-lab/KURE-v1
    backend: sentence-transformers
    prefix_style: none
    dim: 1024

  - key: e5-large-instruct
    hf_id: intfloat/multilingual-e5-large-instruct
    backend: sentence-transformers
    prefix_style: e5_inst
    dim: 1024
    instruction: "Given a question in Korean, retrieve the passage that answers it"

  - key: e5-small-ko
    hf_id: dragonkue/multilingual-e5-small-ko
    backend: sentence-transformers
    prefix_style: e5
    dim: 384

  - key: bge-m3
    hf_id: BAAI/bge-m3
    backend: bge-m3
    prefix_style: none
    dim: 1024
    hybrid:
      enabled: true                    # dense 단독 + 하이브리드 둘 다 리포트
      dense_weight: 1.0
      sparse_weight: 0.3

  # ── 추가 비교 모델 ───────────────────────────────────────────
  # mGTE 논문의 dense 검색 모델. 305M / 8192 토큰까지 지원.
  # 다운로드 ~1.2GB, VRAM ~1GB. 지금 쓰는 A4000 에서 여유롭게 돌아갑니다.
  - key: gte-multilingual-base
    hf_id: Alibaba-NLP/gte-multilingual-base
    backend: sentence-transformers
    prefix_style: none
    dim: 768

  # Gemma2-9B 기반. 이 목록에서 압도적으로 무겁습니다 —
  # 다운로드 ~18.5GB, VRAM ~20GB. A4000(16GB)·A4500(20GB)에서는 OOM 이 납니다.
  # 돌리려면 A5000(24GB) 이상 + Volume Disk 40GB 이상, batch_size 4.
  - key: bge-gemma2
    hf_id: BAAI/bge-multilingual-gemma2
    backend: sentence-transformers
    prefix_style: instruct_gemma
    dim: 3584
    instruction: "Given a question in Korean, retrieve the passage that answers it"
    model_kwargs:
      # Gemma2 는 bfloat16 으로 학습됐다. float16 으로 올리면 활성화가 표현 범위를
      # 넘겨 inf/NaN 이 나고 점수가 0 에 가깝게 망가진다. 반드시 bfloat16 을 쓸 것.
      torch_dtype: bfloat16
